<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Brineworks Funder CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css?v=2026102024">
</head>
<body>
<div id="app">
  <section id="login" class="login" hidden>
    <form id="loginForm" class="login-card" autocomplete="on">
      <h1>Brineworks Funder CRM</h1>
      <p class="sub">Sign in with the email and password you were given.</p>
      <label class="f">Email <input id="loginEmail" type="email" autocomplete="username" required></label>
      <label class="f">Password <input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
      <p class="err" id="loginErr" hidden></p>
    </form>
  </section>

  <section id="shell" hidden>
    <div class="viewas" id="viewAsBar" hidden></div>
    <header class="bar">
      <div class="brand">Brineworks <span>Funder CRM</span></div>
      <nav class="tabs" id="tabs" aria-label="Pages"></nav>
      <div class="me">
        <span class="updated" id="updated" title=""></span>
        <button class="btn ghost" type="button" id="meBtn"></button>
      </div>
    </header>
    <main class="wrap" id="main"></main>
  </section>

  <section id="setupMsg" class="login" hidden>
    <div class="login-card">
      <h1>Almost there</h1>
      <p class="sub">This site needs the address of its Google Apps Script backend. Put it in <code>config.js</code> as <code>apiUrl</code>.</p>
    </div>
  </section>
</div>
<div id="drawerRoot" hidden></div>
<div id="modalRoot" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script src="app.js?v=2026102024"></script>
</body>
</html>
